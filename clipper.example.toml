# clipper.toml, a starter: copy this file to clipper.toml and edit it, or run `clipper setup`,
# which writes one and asks for the rest. Only what differs from the defaults belongs in
# clipper.toml; clipper/defaults.toml lists every setting with its default and what it does, and
# `clipper config get <section>.<key>` shows a value and which file set it. One machine's own
# values go in clipper.local.toml beside it (same sections; setup writes it), and every key can
# also be set with an env var named CLIPPER_<SECTION>_<KEY>, e.g. CLIPPER_TRANSCRIBE_DEVICE=cpu.
# Both win over this file and its [shows.*] tables.

[paths]
streams = "streams"                  # the streams folder every machine sees (a NAS share), relative to this file

[bleep]
mode = "bleep"                       # cover slurs in the audio and mask them in captions

[meta]
title_format = "{SHOW} | {title}"    # titles start with the show's name

[review]
host = "http://<kitsu-host>:8090/api"   # Kitsu's API URL (wiki: Kitsu); review happens there

[record]
channels = ["kick-channel-slug"]     # the Kick channels the recorder watches (wiki: NAS recorder)

[discord]
# Review cards in Discord (wiki: Discord app) once the ids are in:
# enabled = true
# guild_id = ""
# review_channel_id = ""
# allowed_user_ids = ["..."]

# ---------- shows ----------
# One table per show. A stream belongs to the show whose `channels` include the Kick
# channel in its meta.json (recordings and `clipper fetch` both write it), and that
# show's sub-tables override the sections above for it: [shows.<key>.<section>] takes any
# key of [<section>]. Each show gets its own Kitsu production (named after meta.show_name
# unless review.project is set) and its own Discord threads; all shows share the YouTube
# channel and release schedule above. `clipper shows` lists them; `--show <key>` forces
# one. `clipper worker` skips recordings of channels no show claims.

[shows.myshow]
channels = ["kick-channel-slug"]

[shows.myshow.meta]
show_name = "My Show"
cast = ["Alex", "Sam"]

[shows.myshow.scoring]
stream_context = """The show is called My Show; "Welcome to My Show" is its intro, and chat
emotes starting with "myshow" are the channel's own emotes. Regulars and frequent topics
include the online creators the show covers."""
known_figures = "Jane Doe, John Roe"   # people the model should recognise, by the names chat uses

[shows.myshow.preshow]
# The show's own YouTube channel (its id), when it posts a pre-show there before going live:
# youtube_channel = "UC..."

# [shows.<key>.thumbnail], [shows.<key>.discord] etc. work the same way, e.g. a
# different masthead or review channel for one show.
