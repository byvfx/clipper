# Claude Code on the NAS (#65): a `claude remote-control` session in its own clone of the
# repo, reachable from the Claude app on the phone. The NAS dials out to Anthropic; nothing is
# exposed. deploy.sh puts this next to .env (from env.local), the Anthropic key file and the
# build context. Its own compose project, so deploying it never restarts the recorder or the
# hub, and deploying the hub never ends a Claude session.
name: clipper-claude

services:
  claude:
    build: ./src
    image: clipper-claude:latest
    container_name: clipper-claude   # `docker attach clipper-claude` answers its first prompts
    hostname: clipper-nas
    restart: unless-stopped
    init: true                  # clipper stages and Claude's tools run as child processes
    tty: true                   # remote-control asks to be enabled and to trust /app once
    stdin_open: true
    user: "${PUID:-1000}:${PGID:-10}"
    group_add: ["${RENDER_GID:-105}"]   # /dev/dri/renderD128 for QSV, as in the hub
    network_mode: host          # the war room on 127.0.0.1, as in the hub
    env_file: .env              # without ANTHROPIC_API_KEY: Remote Control refuses API-key auth
    environment:
      TZ: ${TZ:-America/Los_Angeles}
      CLIPPER_CUT_BACKEND: local
      CLIPPER_YOUTUBE_COOKIES_FROM_BROWSER: ""
      CLIPPER_PATHS_ANTHROPIC_KEY: /run/secrets/anthropic_key   # clipper's model calls
    secrets:
      - anthropic_key
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ${CLIPPER_DATA:-/volume1/docker/clipper}:/data
      - ${CLIPPER_DATA:-/volume1/docker/clipper}/fonts:/usr/local/share/fonts/clipper:ro
      # The clone (/app) and Claude Code's home (sign-in, settings, memory, uv cache) persist
      # across deploys; deploy.sh makes both folders as the ssh user, so they belong to PUID.
      - ${CLAUDE_DIR:-/volume1/docker/clipper-claude}/repo:/app
      - ${CLAUDE_DIR:-/volume1/docker/clipper-claude}/home:/home/claude
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

secrets:
  anthropic_key:
    file: ./anthropic_key
