# clipper on the NAS: serve (war room + jobs), the Discord bot, the worker, and tailscale
# for the war room off the LAN. deploy.sh puts this next to .env (from env.local) and the
# build context. Its own compose project, so deploys never restart the recorder
# (deploy/record). Host networking: the bot reaches serve and tailscale reaches the war
# room on 127.0.0.1, as on the laptop.
name: clipper-hub

x-clipper: &clipper
  image: clipper-hub:latest
  restart: unless-stopped
  init: true                  # serve and the worker run stages as child processes
  user: "${PUID:-1000}:${PGID:-10}"
  group_add: ["${RENDER_GID:-105}"]   # /dev/dri/renderD128 for QSV
  network_mode: host
  env_file: .env
  environment:
    TZ: ${TZ:-America/Los_Angeles}
    CLIPPER_CUT_BACKEND: local                # this is the NAS: cut here, not over ssh
    CLIPPER_YOUTUBE_COOKIES_FROM_BROWSER: ""  # no browser here: secrets/youtube_cookies.txt
  devices:
    - /dev/dri:/dev/dri
  volumes:
    - ${CLIPPER_DATA:-/volume1/docker/clipper}:/data
    - ${CLIPPER_DATA:-/volume1/docker/clipper}/fonts:/usr/local/share/fonts/clipper:ro
    - tailscale-socket:/var/run/tailscale
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  serve:
    <<: *clipper
    build: ./src
    command: ["serve"]
    stop_grace_period: 60s
  bot:
    <<: *clipper
    command: ["bot"]
  worker:
    <<: *clipper
    command: ["worker"]
    stop_grace_period: 60s
  tailscale:
    image: tailscale/tailscale:v1.104.4
    restart: unless-stopped
    network_mode: host
    environment:
      TS_USERSPACE: "true"    # no tun device; `tailscale serve` proxies to 127.0.0.1:8765
      TS_STATE_DIR: /var/lib/tailscale
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      TS_HOSTNAME: ${TS_HOSTNAME:-clipper}
      TS_AUTHKEY: ${TS_AUTHKEY:-}   # empty: `docker compose logs tailscale` prints a sign-in link
      # The war room on the tailnet, applied by tailscaled itself (root): the clipper
      # containers run as PUID, which may read `tailscale status` but not change serve.
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - tailscale-socket:/var/run/tailscale
      - ./tailscale-serve.json:/config/serve.json:ro

volumes:
  tailscale-state:
  tailscale-socket:
