# The fallback reviewer on every PR that changes code, for when Copilot reviewed nothing
# (out of credits, not requested, or silent for [codereview] copilot_wait_s; 0 = always run):
# `clipper codereview` sends the diff
# against main and the changed files to [codereview] reviewer (Grok 4.7 through OpenRouter,
# about $1 a PR) and posts the bugs it finds on the PR and on the issues the PR
# links, one comment each, edited in place on later pushes. Needs the repo secret
# OPENROUTER_API_KEY (wiki Developing). A failed review never fails the PR's checks.
name: review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ["clipper/**", "tests/**", "deploy/**", ".github/**", "pyproject.toml"]

concurrency:  # a new push replaces a review still running for the old one
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    # A fork's PR and Dependabot's get no secrets; a draft waits until it is ready.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 75   # Grok thinks for ~25 min on a big PR; this bounds a retry
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0   # the diff needs main's history too
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install (base dependencies only)
        run: uv sync --locked --no-dev
      - name: Review and post
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          # CLIPPER_CODEREVIEW_REVIEWER: openrouter:openai/gpt-5.6-sol-pro   # to try another model
          # CLIPPER_CODEREVIEW_COPILOT_WAIT_S: 0   # to run it even when Copilot reviewed
        run: >-
          uv run --no-sync clipper codereview
          --base origin/${{ github.event.pull_request.base.ref }}
          --pr ${{ github.event.pull_request.number }}
