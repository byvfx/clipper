# Lint and tests on every push to main and every pull request. The same two commands
# run locally (see CLAUDE.md "Checks").
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]   # developed on Windows, deployed on Linux: both stay green
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0   # no floating major tags since v8: pin a release
      - name: Install (base dependencies + dev group; no GPU extras)
        run: uv sync --locked
      - name: Ruff
        run: uv run ruff check clipper tests
      - name: Tests
        run: uv run pytest -q
