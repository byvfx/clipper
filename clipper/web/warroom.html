<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="War Room">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Clipper War Room</title>
<style>
:root {
  --bg: #0b0d10; --panel: #12161b; --panel2: #171c22; --line: #232a33; --text: #e6e9ee;
  --dim: #8b95a3; --faint: #5b6574; --accent: #ffd400; --red: #ff3b4e; --green: #2fd17c;
  --blue: #4da3ff; --amber: #ffad33; --violet: #a88bff; --pink: #ff6fae;
  --clip: #4da3ff; --short: #ff6fae; --segment: #2fd17c; --compilation: #ffad33;
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;
  --sans: "Segoe UI", system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 var(--sans); }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }

header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  padding: 10px 18px; background: #0e1115ee; border-bottom: 1px solid var(--line); backdrop-filter: blur(6px); }
.brand { font: 700 15px var(--mono); letter-spacing: .14em; white-space: nowrap; }
.brand b { color: var(--accent); }
.clock { font: 600 13px var(--mono); color: var(--dim); }
.lives { display: flex; gap: 8px; flex-wrap: wrap; }
.live { display: flex; align-items: center; gap: 6px; padding: 3px 9px; border: 1px solid var(--line); border-radius: 99px;
  font-size: 12px; color: var(--dim); background: var(--panel); }
.live .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.live.on { color: var(--text); border-color: #ff3b4e88; background: #2a0e13; }
.live.on .dot { background: var(--red); box-shadow: 0 0 0 0 #ff3b4e; animation: pulse 1.6s infinite; }
.live { cursor: pointer; position: relative; }
.live:hover { border-color: #3a4552; }
.live .rec { font: 700 10px var(--mono); color: var(--red); letter-spacing: .05em; }
.live .rec.off { color: var(--faint); }
.livemenu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; min-width: 230px; padding: 6px; border-radius: 10px;
  background: var(--panel2); border: 1px solid var(--line); box-shadow: 0 8px 30px #000a; display: grid; gap: 4px; cursor: default; }
.livemenu .btn { text-align: left; }
.livemenu label { display: flex; gap: 6px; align-items: center; font-size: 11px; color: var(--dim); padding: 4px 4px 0; cursor: pointer; }
.livemenu .info { font-size: 11px; color: var(--faint); padding: 2px 4px 4px; }
#dock { position: fixed; right: 18px; bottom: 18px; z-index: 30; width: 480px; max-width: calc(100vw - 36px); background: var(--panel);
  border: 1px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: 0 12px 40px #000c; }
#dock.big { width: 960px; }
#dock .d-head { display: flex; align-items: center; gap: 8px; padding: 6px 10px; font-size: 12px; border-bottom: 1px solid var(--line); }
#dock .d-head .btn { padding: 2px 8px; font-size: 12px; }
#dock .d-head .sp { margin-left: auto; }
#dock iframe { display: block; width: 100%; aspect-ratio: 16/9; border: 0; background: #000; }
.card.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
#keys { width: min(560px, 94vw); }
#keys .k-body { padding: 8px 18px 18px; display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 13px; }
#keys h4 { grid-column: 1 / -1; margin: 10px 0 0; font: 700 11px var(--mono); color: var(--dim); letter-spacing: .1em; text-transform: uppercase; }
kbd { font: 600 11px var(--mono); padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); border-bottom-width: 2px; background: var(--panel2); white-space: nowrap; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 #ff3b4e99; } 70% { box-shadow: 0 0 0 8px #ff3b4e00; } 100% { box-shadow: 0 0 0 0 #ff3b4e00; } }
.counters { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
.counter { padding: 4px 10px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); text-align: center; min-width: 74px; }
.counter b { display: block; font: 700 18px var(--mono); }
.counter span { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
.counter.hot b { color: var(--accent); }
.counter.warn b { color: var(--amber); }
.tools { display: flex; gap: 6px; }
.btn { padding: 6px 11px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel2); font-size: 13px; }
.btn:hover { border-color: #3a4552; }
.btn.primary { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 600; }
.btn.good { background: #123524; border-color: #1f6b44; color: #7ff0b2; }
.btn.bad { background: #3a1218; border-color: #7a2230; color: #ff98a3; }
.btn.warn { background: #3a2a10; border-color: #7a5520; color: #ffcf85; }
.btn:disabled { opacity: .5; cursor: default; }

main { display: grid; grid-template-columns: 300px minmax(0, 1fr) 340px; gap: 14px; padding: 14px 18px; }
@media (max-width: 1250px) { main { grid-template-columns: 1fr; } }
#vStats { grid-column: 1 / -1; }
.stats { padding: 12px 14px; display: grid; gap: 16px; font-size: 12px; color: var(--dim); }
.stats .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.stats .tile { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px; }
.stats .tile b { font: 700 22px var(--mono); color: var(--text); }
.stats .tile .d { font: 11px var(--mono); color: var(--faint); }
.stats .tile .d.up { color: var(--green); } .stats .tile .d.down { color: var(--red); }
.stats h3 { font: 700 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); margin: 0 0 6px; }
.stats .two { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 18px; }
.stats .four { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
@media (max-width: 900px) { .stats .two { grid-template-columns: 1fr; } }
.stats svg { display: block; width: 100%; height: auto; overflow: visible; }
.stats svg .gl { stroke: var(--line); stroke-width: 1; }
.stats svg text { fill: var(--faint); font: 10px var(--mono); }
.stats svg .bar { fill: var(--blue); }
.stats svg .hit { fill: transparent; cursor: default; }
.stats svg .hit:hover + .bar, .stats svg g:hover .bar { fill: #7bbcff; }
.stats .hb { display: grid; grid-template-columns: minmax(90px, auto) 1fr auto; gap: 5px 10px; align-items: center; }
.stats .hb .lab { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stats .hb .track { height: 8px; }
.stats .hb .fill { height: 8px; border-radius: 0 4px 4px 0; background: var(--blue); min-width: 2px; }
.stats .hb .v { font: 11px var(--mono); color: var(--dim); text-align: right; white-space: nowrap; }
.stats .hb .few { color: var(--faint); }
.stats table { width: 100%; border-collapse: collapse; font: 11px var(--mono); }
.stats td, .stats th { padding: 3px 6px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
.stats td:first-child, .stats th:first-child { text-align: left; color: var(--text); }
.stats th { color: var(--faint); font-weight: 500; }
.stats tr.few td { color: var(--faint); }
.stats .vids { display: grid; gap: 4px; }
.stats .vids a { color: var(--text); text-decoration: none; } .stats .vids a:hover { text-decoration: underline; }
.stats .vids .n { font: 700 12px var(--mono); color: var(--text); display: inline-block; min-width: 44px; }
.stats .note { color: var(--faint); font-size: 11px; }
.stats .tip { position: fixed; pointer-events: none; z-index: 60; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font: 11px/1.5 var(--mono); color: var(--text); box-shadow: 0 6px 20px #000a; }
.stats .tip[hidden] { display: none; }
section.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.panel h2 { margin: 0; padding: 10px 14px; font: 700 12px var(--mono); letter-spacing: .12em; text-transform: uppercase;
  color: var(--dim); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
.panel h2 .sp { margin-left: auto; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--faint); }
.col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

.stream { padding: 10px 14px; border-bottom: 1px solid var(--line); }
.stream:last-child { border-bottom: 0; }
.stream .top { display: flex; gap: 8px; align-items: baseline; }
.tag { font: 600 10px var(--mono); padding: 1px 6px; border-radius: 4px; background: #222a33; color: var(--dim); text-transform: uppercase; white-space: nowrap; }
.stream .t { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.stages { display: flex; gap: 3px; margin-top: 7px; }
.stage { flex: 1; height: 6px; border-radius: 3px; background: #262e38; position: relative; }
.stage.done { background: var(--green); }
.stage.running { background: var(--accent); animation: blink 1s infinite alternate; }
.stage.failed { background: var(--red); }
.stage.skipped { background: #3a4552; }
@keyframes blink { from { opacity: 1; } to { opacity: .45; } }
.stream .meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--faint); margin-top: 4px; }

.feed { max-height: 360px; overflow: auto; }
.ev { padding: 9px 14px; border-bottom: 1px solid var(--line); font-size: 12px; }
.ev .w { color: var(--faint); font-family: var(--mono); font-size: 11px; }
.ev q { color: var(--dim); display: block; margin: 3px 0; quotes: "\201C" "\201D"; }
.ev .r-applied { color: var(--green); } .ev .r-unsupported { color: var(--amber); } .ev .r-error { color: var(--red); }
.health { padding: 10px 14px; font-size: 12px; color: var(--dim); display: grid; gap: 5px; }
.health .ok { color: var(--green); } .health .bad { color: var(--red); } .health .mid { color: var(--amber); }

.queue-bar { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--line); align-items: center; }
.tab { padding: 5px 11px; border-radius: 99px; border: 1px solid var(--line); background: transparent; font-size: 12px; color: var(--dim); }
.tab.on { background: var(--text); color: #111; border-color: var(--text); font-weight: 600; }
.tab .n { font-family: var(--mono); opacity: .7; margin-left: 4px; }
.sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
input.search, input.date, select { background: var(--panel2); border: 1px solid var(--line); color: var(--text); border-radius: 7px; padding: 5px 9px; font: inherit; font-size: 12px; }
input.search { margin-left: auto; width: 180px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; padding: 14px; }
.card { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; transition: border-color .15s, transform .15s; }
.card:hover { border-color: #3a4552; transform: translateY(-1px); }
.card.busy { opacity: .55; pointer-events: none; }
.thumb { position: relative; aspect-ratio: 16/9; background: #05070a; cursor: pointer; overflow: hidden; }
.thumb img, .thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb.vertical video { object-fit: contain; }
.thumb .kind { position: absolute; top: 7px; left: 7px; }
.kind { font: 700 10px var(--mono); padding: 2px 7px; border-radius: 4px; color: #111; text-transform: uppercase; letter-spacing: .05em; }
.kind.pick { background: var(--clip); } .kind.short { background: var(--short); } .kind.segment { background: var(--segment); } .kind.compilation { background: var(--compilation); }
.thumb .dur { position: absolute; bottom: 7px; right: 7px; font: 600 11px var(--mono); background: #000c; padding: 1px 6px; border-radius: 4px; }
.thumb .state { position: absolute; top: 7px; right: 7px; font: 700 10px var(--mono); padding: 2px 7px; border-radius: 4px; background: #000c; }
.state.changes_requested { color: var(--amber); } .state.approved { color: var(--green); } .state.rejected { color: var(--red); } .state.pending { color: var(--dim); }
.card .body { padding: 9px 11px; flex: 1; display: flex; flex-direction: column; gap: 4px; }
.card .title { font-weight: 600; font-size: 13px; line-height: 1.3; cursor: pointer; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .sub { font-size: 11px; color: var(--faint); display: flex; gap: 6px; flex-wrap: wrap; }
.card .hook { font-size: 12px; color: var(--dim); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .note { font-size: 11px; color: var(--amber); }
.card .acts { display: flex; gap: 5px; padding: 0 11px 11px; }
.card .acts .btn { flex: 1; padding: 5px 0; font-size: 12px; }
.card .acts .pickl { flex: 0 0 auto; display: flex; align-items: center; padding: 0 3px; cursor: pointer; }
.card .acts .pickl input { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
.card.picked { border-color: var(--accent); }
.card .hit { font-size: 11px; color: var(--dim); font-style: italic; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.bulk { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--line); background: #17202b; font-size: 12px; }
.bulk[hidden] { display: none; }
.bulk .btn { padding: 4px 10px; font-size: 12px; }
.toast .btn { margin-left: 12px; padding: 2px 10px; font-size: 12px; }
#tool { width: min(820px, 96vw); }
#tool .m-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
#tool .m-head .x { margin-left: auto; background: none; border: 0; color: var(--dim); font-size: 22px; cursor: pointer; }
#tool .tbody { padding: 12px 16px; display: grid; gap: 9px; font-size: 13px; }
#tool .tbody label { display: inline-flex; gap: 5px; align-items: center; margin-right: 12px; }
#tool .tbody input.search { margin: 0; width: 100%; font-size: 13px; }
.rep-list { font: 12px/1.5 var(--mono); max-height: 50vh; overflow: auto; display: grid; gap: 6px; }
.rep-list .it b { color: var(--text); } .rep-list .f { color: var(--faint); }
.rep-list del { color: #ff98a3; text-decoration: none; } .rep-list ins { color: #7ff0b2; text-decoration: none; }
.undo-list { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 12px; align-items: center; font-size: 12px; }
.undo-list .f { color: var(--faint); font-family: var(--mono); } .undo-list .gone { color: var(--faint); text-decoration: line-through; }
.empty { padding: 40px; text-align: center; color: var(--faint); }

.day { border-bottom: 1px solid var(--line); }
.day h3 { margin: 0; padding: 8px 14px 4px; font: 700 11px var(--mono); color: var(--dim); letter-spacing: .08em; text-transform: uppercase; display: flex; }
.day h3 .n { margin-left: auto; color: var(--faint); }
.day.today h3 { color: var(--accent); }
.day.past { opacity: .5; }
.slot { display: grid; grid-template-columns: 46px 6px 1fr; gap: 8px; padding: 5px 14px; align-items: center; cursor: pointer; }
.slot:hover { background: var(--panel2); }
.slot .tm { font: 600 12px var(--mono); color: var(--dim); }
.slot .bar { width: 4px; height: 30px; border-radius: 2px; }
.slot .bar.clip { background: var(--clip); } .slot .bar.short { background: var(--short); } .slot .bar.segment { background: var(--segment); } .slot .bar.compilation { background: var(--compilation); }
.slot .tt { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot .ss { font-size: 11px; color: var(--faint); }
/* #20 drag and drop */
.slot[draggable="true"] { cursor: grab; }
.slot.free { cursor: default; opacity: .55; }
.slot.free .tt { color: var(--faint); font-style: italic; }
.slot.free .bar { opacity: .5; }
.slot.over, .unpin.over, .day h3.over { background: #23314a; outline: 1px dashed var(--blue); opacity: 1; }
.sched-tools { display: flex; gap: 8px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; font-size: 11px; color: var(--faint); }
.sched-tools label { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; }
.unpin { border: 1px dashed var(--line); border-radius: 7px; padding: 4px 10px; }
.unslotted { padding: 6px 14px 10px; border-bottom: 1px solid var(--line); display: grid; gap: 3px; max-height: 220px; overflow: auto; }
.unslotted .chip { display: grid; grid-template-columns: 6px 1fr; gap: 8px; align-items: center; font-size: 12px; padding: 3px 6px; border-radius: 6px; cursor: grab; }
.unslotted .chip:hover { background: var(--panel2); }
.unslotted .chip span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* #18 cover editor */
#tool.cover { width: min(1180px, 97vw); }
.cv { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(280px, 1fr); gap: 16px; padding: 12px 16px; }
@media (max-width: 800px) { .cv { grid-template-columns: 1fr; } }
.cv .shot { width: 100%; border-radius: 8px; display: block; background: #000; }
.cv .frames { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; margin-top: 8px; }
.cv .frames button { padding: 0; border: 2px solid transparent; border-radius: 6px; background: none; position: relative; cursor: pointer; }
.cv .frames button img { width: 100%; display: block; border-radius: 4px; }
.cv .frames button.main { border-color: var(--accent); } .cv .frames button.inset { border-color: var(--blue); }
.cv .frames button span { position: absolute; top: 2px; left: 4px; font: 700 10px var(--mono); text-shadow: 0 0 3px #000; }
.cv .boxwrap { position: relative; margin-top: 10px; user-select: none; touch-action: none; }
.cv .boxwrap img { width: 100%; display: block; border-radius: 6px; }
.cv .box { position: absolute; border: 2px solid var(--accent); box-shadow: 0 0 0 9999px #0007; cursor: move; }
.cv .box.inset { border-color: var(--blue); }
.cv .box i { position: absolute; right: -7px; bottom: -7px; width: 12px; height: 12px; background: var(--accent); border-radius: 2px; cursor: nwse-resize; }
.cv .form { display: grid; gap: 7px; font-size: 12px; color: var(--dim); align-content: start; }
.cv .form input, .cv .form select { width: 100%; margin: 0; font-size: 13px; }
.cv .form .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.cv .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.cv .seg button { border: 0; background: none; padding: 3px 10px; color: var(--dim); font-size: 12px; cursor: pointer; }
.cv .seg button.on { background: var(--panel2); color: var(--text); }
.slot .up { color: var(--green); }
.sched { max-height: calc(100vh - 140px); overflow: auto; }

dialog { width: min(1100px, 96vw); max-height: 94vh; padding: 0; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--text); }
dialog::backdrop { background: #000b; }
.m-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.m-head .x { margin-left: auto; background: none; border: 0; font-size: 22px; color: var(--dim); }
.m-body { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 16px; padding: 16px; overflow: auto; max-height: calc(94vh - 60px); }
@media (max-width: 900px) { .m-body { grid-template-columns: 1fr; } }
.player video { width: 100%; max-height: 62vh; background: #000; border-radius: 8px; }
.player img { width: 100%; border-radius: 8px; margin-top: 10px; border: 1px solid var(--line); }
.form label { display: block; font: 600 11px var(--mono); color: var(--dim); text-transform: uppercase; letter-spacing: .06em; margin: 10px 0 4px; }
.form input, .form textarea { width: 100%; background: var(--panel2); border: 1px solid var(--line); color: var(--text); border-radius: 7px; padding: 7px 9px; font: inherit; font-size: 13px; }
.form textarea { min-height: 70px; resize: vertical; }
.form .row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.form .hint { font-size: 11px; color: var(--faint); margin-top: 3px; }
.kv { font-size: 12px; color: var(--dim); display: grid; grid-template-columns: 90px 1fr; gap: 3px 10px; margin-top: 6px; }
.kv b { color: var(--faint); font-weight: 500; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--line); padding: 10px 16px; border-radius: 10px; z-index: 50; box-shadow: 0 8px 30px #000a; font-size: 13px; max-width: 80vw; }
.toast.err { border-color: #7a2230; color: #ff98a3; }

#mActs .nav { padding: 6px 12px; }
.tap { position: relative; display: block; width: 100%; aspect-ratio: 16/9; border: 0; padding: 0; border-radius: 8px; overflow: hidden; background: #000; }
.tap.vertical { aspect-ratio: 9/16; max-height: 62vh; }
.tap img { width: 100%; height: 100%; object-fit: contain; display: block; opacity: .75; }
.tap span { position: absolute; inset: 0; display: grid; place-content: center; gap: 6px; text-align: center; font-size: 13px; color: #fff; text-shadow: 0 1px 4px #000; }

nav.views { display: none; }
.issues { color: var(--amber); cursor: help; }
.warn-line { font-size: 12px; color: var(--amber); margin-top: 4px; }
.pop { position: absolute; bottom: 7px; left: 7px; padding: 1px 7px; border-radius: 4px; border: 0; background: #000c;
  color: var(--text); font-size: 12px; opacity: 0; transition: opacity .15s; }
.thumb:hover .pop { opacity: 1; }
.uploads { padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--dim); display: grid; gap: 6px; }
.uploads .cap { display: flex; align-items: center; gap: 8px; }
.uploads .meter { flex: 1; height: 6px; border-radius: 3px; background: #262e38; overflow: hidden; }
.uploads .meter i { display: block; height: 100%; background: var(--green); }
.uploads .meter i.full { background: var(--amber); }
.uploads .log { font: 11px/1.45 var(--mono); color: var(--faint); white-space: pre-wrap; word-break: break-word; max-height: 150px; overflow: auto;
  background: var(--panel2); border-radius: 6px; padding: 6px 8px; }
.uploads .log .bad { color: var(--red); } .uploads .log .ok { color: var(--green); }
.uploads .nx { display: grid; grid-template-columns: 78px 1fr; gap: 2px 8px; }
.uploads .nx .due { color: var(--accent); }
.cloud { padding: 10px 14px; font-size: 12px; color: var(--dim); display: grid; gap: 7px; }
.cloud .row { display: flex; align-items: center; gap: 8px; }
.cloud .big { font: 700 16px var(--mono); color: var(--text); }
.cloud .meter { flex: 1; height: 6px; border-radius: 3px; background: #262e38; overflow: hidden; }
.cloud .meter i { display: block; height: 100%; background: var(--green); }
.cloud .meter i.warn { background: var(--amber); } .cloud .meter i.over { background: var(--red); }
.cloud .runs { display: grid; grid-template-columns: 1fr auto auto; gap: 2px 10px; font: 11px/1.45 var(--mono); }
.cloud .runs .w { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
.cloud .bad { color: var(--red); } .cloud .now { color: var(--accent); } .cloud .f { color: var(--faint); }
.cloud .sub { font: 700 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); margin-top: 3px; }
.cloud a { color: var(--blue); }
.queue-bar .tabs { display: contents; }

/* phones (#25): one view at a time, bottom tabs, a full-screen item with the decisions at the thumb */
@media (max-width: 700px) {
  html, body { font-size: 15px; }
  header { position: static; gap: 8px; padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top)); }
  .brand { font-size: 13px; }
  .clock, #keysBtn { display: none; }
  .tools { margin-left: auto; }
  .tools .btn { padding: 8px 10px; }
  .lives { order: 3; width: 100%; flex-wrap: nowrap; overflow-x: auto; }
  .live { padding: 6px 10px; white-space: nowrap; }
  .livemenu .btn { padding: 12px; }
  .counters { order: 4; width: 100%; margin: 0; flex-wrap: nowrap; overflow-x: auto; }
  .counter { min-width: 66px; flex: none; }
  main { display: block; padding: 10px 0 calc(74px + env(safe-area-inset-bottom)); }
  #vPipe, #vQueue, #vSched, #vStats { display: none; }
  body[data-view="queue"] #vQueue, body[data-view="schedule"] #vSched, body[data-view="pipeline"] #vPipe { display: flex; }
  body[data-view="stats"] #vStats { display: block; }
  #vQueue, #vSched { flex-direction: column; }
  section.panel { border-radius: 0; border-left: 0; border-right: 0; }
  .queue-bar { gap: 8px; }
  .queue-bar .tabs { display: flex; gap: 6px; overflow-x: auto; width: 100%; padding-bottom: 2px; }
  .tab { padding: 8px 13px; font-size: 13px; white-space: nowrap; }
  .queue-bar .sep { display: none; }
  .queue-bar select { flex: 1; padding: 9px; font-size: 14px; }
  input.search { width: 100%; margin: 0; padding: 10px; font-size: 16px; }  /* 16px: iOS doesn't zoom */
  .grid { grid-template-columns: 1fr; padding: 10px; gap: 10px; }
  .card:hover { transform: none; }
  .card .acts .btn { padding: 12px 0; font-size: 14px; }
  .sched { max-height: none; }
  .slot { padding: 8px 12px; grid-template-columns: 64px 6px 1fr; }
  .slot .tm { white-space: nowrap; }
  .slot .tt { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  dialog#modal { width: 100vw; max-width: 100vw; height: 100dvh; max-height: 100dvh; margin: 0; border: 0; border-radius: 0; }
  dialog#modal { overflow-x: hidden; }
  #modal .m-head { padding-top: max(10px, env(safe-area-inset-top)); gap: 8px; }
  #modal .m-head b { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #modal .m-head .tag { display: none; }
  #modal .m-head .x { font-size: 30px; padding: 0 6px; }
  #modal .m-body { display: block; padding: 0 0 calc(84px + env(safe-area-inset-bottom)); max-height: calc(100dvh - 54px); }
  #modal .player { padding: 0 0 4px; }
  #modal .player video, #modal .tap { border-radius: 0; max-height: 56vh; }
  #modal .tap + img { display: none; }  /* the cover is already behind the play button */
  #modal .player > img, #modal .kv, #modal .player > .form { margin-left: 12px; margin-right: 12px; width: calc(100% - 24px); }
  #modal .form { padding: 0 12px; }
  .form input, .form textarea { font-size: 16px; padding: 10px; }
  .form .row .btn { padding: 11px 14px; }
  #mActs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; margin: 0; padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
    background: #0e1115f2; border-top: 1px solid var(--line); flex-wrap: nowrap; gap: 6px; }
  #mActs .btn { flex: 1; padding: 13px 0; font-size: 15px; white-space: nowrap; }
  #mActs .nav { flex: 0 0 44px; }
  nav.views { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: #0e1115f2; backdrop-filter: blur(6px);
    border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  nav.views button { flex: 1; background: none; border: 0; padding: 12px 0 10px; color: var(--dim); font-size: 12px; display: grid; gap: 2px; }
  nav.views button b { font-size: 18px; }
  nav.views button.on { color: var(--accent); }
  nav.views .n { font-family: var(--mono); }
  .pop { display: none; }
  #dock { right: 8px; left: 8px; width: auto; bottom: calc(70px + env(safe-area-inset-bottom)); }
  #dock.big { width: auto; }
  .toast { bottom: calc(80px + env(safe-area-inset-bottom)); }
}
</style>
</head>
<body>
<header>
  <div class="brand">CLIPPER <b>//</b> WAR ROOM</div>
  <div class="clock" id="clock"></div>
  <div class="lives" id="lives"></div>
  <div class="counters" id="counters"></div>
  <div class="tools">
    <button class="btn" id="syncBtn" title="Read decisions and edits from Kitsu now">⟳ Sync Kitsu</button>
    <button class="btn" id="replanBtn" title="Rerun clipper schedule">Replan</button>
    <button class="btn" id="keysBtn" title="Keyboard shortcuts (?)">?</button>
  </div>
</header>

<main>
  <div class="col" id="vPipe">
    <section class="panel"><h2>Pipeline <span class="sp" id="pipeSub"></span></h2><div id="streams"></div></section>
    <section class="panel"><h2>Retakes <span class="sp" id="retakeSub"></span></h2><div class="feed" id="retakes"></div></section>
    <section class="panel"><h2>Health</h2><div class="health" id="health"></div></section>
    <section class="panel"><h2>Modal <span class="sp" id="cloudSub"></span></h2><div class="cloud" id="cloud"><div class="empty">Asking Modal…</div></div></section>
    <section class="panel"><h2>Costs <span class="sp" id="costSub"></span></h2><div class="cloud" id="costs"><div class="empty">Adding up…</div></div></section>
  </div>

  <section class="panel" id="vQueue">
    <h2>Review queue <span class="sp" id="queueSub"></span></h2>
    <div class="queue-bar" id="queueBar"></div>
    <div class="bulk" id="bulk" hidden></div>
    <div class="grid" id="grid"></div>
  </section>

  <section class="panel" id="vStats">
    <h2>Analytics <span class="sp" id="statsSub"></span>
      <select id="statsMonth" style="margin-left:auto" title="Month"></select></h2>
    <div class="stats" id="stats"><div class="empty">Reading analytics.json…</div></div>
  </section>

  <section class="panel" id="vSched">
    <h2>Schedule <span class="sp" id="schedSub"></span></h2>
    <div class="uploads" id="uploads"></div>
    <div class="sched-tools" id="schedTools"></div>
    <div class="unslotted" id="unslotted" hidden></div>
    <div class="sched" id="schedule"></div>
  </section>
</main>
<nav class="views" id="views">
  <button data-view="queue"><b>☰</b>Review <span class="n" id="vnQueue"></span></button>
  <button data-view="schedule"><b>◷</b>Schedule</button>
  <button data-view="pipeline"><b>⚙</b>Pipeline</button>
  <button data-view="stats"><b>▥</b>Stats</button>
</nav>

<dialog id="modal"></dialog>
<dialog id="keys"></dialog>
<dialog id="tool"></dialog>
<div id="dock" hidden></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const KIND = { pick: "Clip", short: "Short", segment: "Segment", compilation: "Comp" };
const DEC = { pending: "waiting", changes_requested: "changes", approved: "approved", rejected: "rejected" };
let STATE = null, TAB = "waiting", SHOW = "", KINDF = "", Q = "", BUSY = new Set(), OPEN = null;
let ST = "", FROM = "", TO = "", THITS = {}, THQ = "", PICK = new Set(), LASTPICK = null;
let VISIBLE = [], SEL = null, SEL_AT = 0;  // the queue in display order; the keyboard's item
const PHONE = matchMedia("(max-width: 700px)");

function mmss(s) { if (s == null) return ""; s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return h ? `${h}:${String(m).padStart(2, "0")}:${String(x).padStart(2, "0")}` : `${m}:${String(x).padStart(2, "0")}`; }
function ago(iso) { if (!iso) return ""; const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 90) return "just now"; if (s < 5400) return Math.round(s / 60) + " min ago"; if (s < 129600) return Math.round(s / 3600) + " h ago"; return Math.round(s / 86400) + " d ago"; }
function toast(msg, err, undoId) { const t = document.createElement("div"); t.className = "toast" + (err ? " err" : ""); t.textContent = msg;
  if (undoId) { const b = document.createElement("button"); b.className = "btn"; b.textContent = "Undo"; b.onclick = () => { t.remove(); undo(undoId); }; t.appendChild(b); }
  document.querySelectorAll(".toast").forEach(o => o.remove());
  document.body.appendChild(t); setTimeout(() => t.remove(), undoId ? 10000 : err ? 7000 : 3500); }
async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const j = await r.json().catch(() => ({ error: r.statusText }));
  if (!r.ok || j.error) throw new Error(j.error || r.statusText);
  return j;
}

function tick() {
  const tz = STATE?.timezone || undefined;
  $("#clock").textContent = new Date().toLocaleString([], { timeZone: tz, weekday: "short", hour: "2-digit", minute: "2-digit", second: "2-digit" });
}
setInterval(tick, 1000);

async function refresh() {
  try { STATE = await api("/api/overview"); render(); }
  catch (e) { toast("Refresh failed: " + e.message, true); }
}
// ---------- live shows ----------

let LIVE = [], LIVEMENU = null;
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch { /* private window */ } } };
function since(iso) {  // Kick gives "2026-10-23 01:02:03" in UTC
  if (!iso) return "";
  const t = new Date(/[zZ]|[+-]\d\d:?\d\d$/.test(iso) ? iso : iso.replace(" ", "T") + "Z");
  const m = Math.max(0, Math.round((Date.now() - t) / 60000));
  return isNaN(m) ? "" : m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")}`;
}
function recording(l) {  // the NAS recorder's stream for this channel, if it's on it now
  return (STATE?.streams || []).find(s => s.channel === l.channel && ["recording", "paused", "finalizing"].includes(s.recording));
}
async function refreshLive() {
  try { LIVE = await api("/api/live"); renderLive(); }
  catch (e) { /* Kick unreachable: keep the last state */ }
}
function renderLive() {
  $("#lives").innerHTML = LIVE.map((l, n) => {
    const rec = l.live ? recording(l) : null;
    const tip = l.live ? `${l.title || ""}\nlive ${since(l.since)} · ${rec ? "recording " + rec.id : "NOT recording"}` : `${l.channel}: offline, click for the channel`;
    return `<span class="live ${l.live ? "on" : ""}" data-live="${n}" title="${esc(tip)}"><span class="dot"></span>${esc(l.show_name)}${l.live
      ? ` · LIVE${l.viewers != null ? " · " + l.viewers.toLocaleString() : ""}${l.since ? " · " + since(l.since) : ""} <span class="rec ${rec ? "" : "off"}">${rec ? "● REC" : "○ no rec"}</span>` : ""}${LIVEMENU === n ? liveMenu(l, rec) : ""}</span>`;
  }).join("");
}
function liveMenu(l, rec) {
  return `<div class="livemenu" data-menu>
    <div class="info">${esc(l.channel)} · ${rec ? `recording ${esc(rec.id)} (${esc(rec.recording)})` : "the NAS isn't recording it"}</div>
    <button class="btn" data-watch="here" data-ch="${esc(l.channel)}">▶ Watch here</button>
    <button class="btn" data-watch="window" data-ch="${esc(l.channel)}">↗ Open in a new window</button>
    <label><input type="checkbox" id="liveRemember"> Always do this (shift-click a chip to ask again)</label></div>`;
}
function watch(ch, where) {
  const name = LIVE.find(l => l.channel === ch)?.show_name || ch;
  if (where === "window") { window.open(`https://kick.com/${encodeURIComponent(ch)}`, `kick-${ch}`); return; }
  const d = $("#dock"); d.hidden = false;
  d.innerHTML = `<div class="d-head"><span class="dot" style="width:8px;height:8px;border-radius:50%;background:var(--red)"></span><b>${esc(name)}</b><span style="color:var(--faint)">${esc(ch)}</span>
    <span class="sp"></span><button class="btn" id="dSize" title="Bigger / smaller">⤢</button>
    <button class="btn" id="dPop" title="Open on kick.com in a new window instead">↗</button>
    <button class="btn" id="dClose" title="Close the player">×</button></div>
    <iframe src="https://player.kick.com/${encodeURIComponent(ch)}?autoplay=true" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`;
  d.classList.toggle("big", !!store.get("warroom.dock.big"));
  $("#dSize").onclick = () => { d.classList.toggle("big"); store.set("warroom.dock.big", d.classList.contains("big") ? "1" : null); };
  $("#dPop").onclick = () => { closeDock(); watch(ch, "window"); };
  $("#dClose").onclick = closeDock;
}
function closeDock() { const d = $("#dock"); d.innerHTML = ""; d.hidden = true; }
function liveClick(e, t) {
  if (e.target.closest("[data-menu]")) {
    const w = e.target.closest("[data-watch]");
    if (!w) return;
    if ($("#liveRemember")?.checked) store.set("warroom.watch", w.dataset.watch);
    LIVEMENU = null; renderLive(); watch(w.dataset.ch, w.dataset.watch);
    return;
  }
  const n = +t.dataset.live, l = LIVE[n];
  if (!l.live) { window.open(`https://kick.com/${encodeURIComponent(l.channel)}`, "_blank"); return; }
  const remembered = store.get("warroom.watch");
  if (remembered && !e.shiftKey) { watch(l.channel, remembered); return; }
  if (e.shiftKey) store.set("warroom.watch", null);  // shift-click: forget the choice, ask
  LIVEMENU = LIVEMENU === n ? null : n; renderLive();
}

function render() {
  const s = STATE, c = s.counts;
  $("#counters").innerHTML = [
    ["Waiting", c.pending, c.pending ? "hot" : ""], ["Changes", c.changes || 0, c.changes ? "warn" : ""],
    ["Approved", c.approved || 0, ""], ["Unslotted", c.approved_unscheduled, c.approved_unscheduled ? "warn" : ""],
    ["Next 7 d", c.scheduled_7d, ""], ["Uploaded", c.uploaded, ""],
  ].map(([l, n, k]) => `<div class="counter ${k}"><b>${n}</b><span>${l}</span></div>`).join("");
  const first = !$("#schedule").children.length;
  renderStreams(); renderRetakes(); renderHealth(); renderQueue(); renderUploads(); renderSchedule(); renderLive(); tick();
  if (first && document.body.dataset.view === "schedule") setView("schedule");  // opened on it: go to today
  if (OPEN) { const r = s.items.find(i => i.ref === OPEN); if (r && !$("#modal").contains(document.activeElement)) fillModalState(r); }
}

function renderStreams() {
  const st = STATE.streams;
  $("#pipeSub").textContent = st.filter(x => x.run_status === "running").length ? "running" : "";
  $("#streams").innerHTML = st.slice(0, 10).map(x => {
    const done = STATE.stages.filter(g => x.stages[g] === "done").length;
    const status = x.recording && x.recording !== "done" ? `● ${x.recording}` : x.run_status === "running" ? "running"
      : x.run_status === "failed" ? "failed" : done === STATE.stages.length ? "done" : x.published ? "in review" : `${done}/${STATE.stages.length}`;
    return `<div class="stream" title="${esc(x.run_error)}">
      <div class="top"><span class="tag">${esc(x.show_name || x.channel)}</span><b style="font-size:12px">${esc(x.started_at.slice(0, 10))}</b>
        <span style="margin-left:auto;font-size:11px;color:${x.run_status === "failed" ? "var(--red)" : x.run_status === "running" ? "var(--accent)" : "var(--faint)"}">${esc(status)}</span></div>
      <div class="t">${esc(x.title)}</div>
      <div class="stages">${STATE.stages.map(g => `<div class="stage ${esc(x.stages[g] || "")}" title="${g}: ${x.stages[g] || "not yet"}"></div>`).join("")}</div>
      <div class="meta"><span>${esc(x.id)}</span><span>${x.duration_s ? (x.duration_s / 3600).toFixed(1) + " h" : ""}</span></div></div>`;
  }).join("") || `<div class="empty">No streams yet</div>`;
}

function renderRetakes() {
  const r = STATE.retakes;
  $("#retakeSub").textContent = STATE.health.retake_running ? "working…" : "";
  $("#retakes").innerHTML = r.map(h => `<div class="ev">
      <div class="w">${esc(ago(h.at))} · ${esc(h.stream)}/${esc(h.key.split("_")[0])}</div>
      <q>${esc(h.comment)}</q>
      <div class="r-${esc(h.result)}">${h.result === "applied" ? "✓ " + esc(h.summary || h.applied.join("; "))
        : h.result === "unsupported" ? "⚠ " + esc(h.unsupported || "not applied") : h.result === "error" ? "✕ " + esc(h.error) : esc(h.result)}</div></div>`).join("")
    || `<div class="empty">No retakes yet. Set an item to retake with a note and clipper re-cuts it.</div>`;
}

function renderHealth() {
  const h = STATE.health, botAge = h.bot_log_age_s;
  const bot = !h.bot_lock ? ["bad", "not running"] : botAge != null && botAge > 1800 ? ["mid", `quiet ${Math.round(botAge / 60)} min`] : ["ok", "running"];
  $("#health").innerHTML = `
    <div>Discord bot: <span class="${bot[0]}">${bot[1]}</span></div>
    <div>Retakes: <span class="${h.retake_running ? "mid" : "ok"}">${h.retake_running ? "working" : "idle"}</span></div>
    <div>Kitsu sync: <span class="${h.sync.error ? "bad" : h.sync.running ? "mid" : "ok"}">${h.sync.running ? "syncing…" : h.sync.error ? esc(h.sync.error) : h.sync.last ? ago(h.sync.last) : "via bot"}</span></div>
    <div>YouTube uploads: <span class="${h.auto_upload_minutes ? "ok" : "mid"}">${h.auto_upload_minutes ? "automatic, every " + h.auto_upload_minutes + " min" : "by hand (clipper upload)"}</span></div>
    <div>Schedule: ${STATE.schedule_generated_at ? "planned " + ago(STATE.schedule_generated_at) : "never planned"}</div>
    <div style="color:var(--faint);font-family:var(--mono);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(h.bot_last)}">${esc(h.bot_last)}</div>`;
  $("#syncBtn").disabled = h.sync.running;
}

// #24: one search box over every stream's titles, descriptions, topics, hashtags and, from
// the server, the items' captions; filters combine, and live in the URL (#q=...&st=...).
const STATUS = { unslotted: i => i.decision === "approved" && !i.scheduled && !i.uploaded && !i.dropped,
  scheduled: i => !!i.scheduled && !i.uploaded, uploaded: i => i.uploaded, held: i => i.hold,
  pinned: i => !!i.publish_at, dropped: i => !!i.dropped, issues: i => (i.issues || []).length > 0 };
const STATUS_LABEL = { unslotted: "Approved, no slot", scheduled: "Scheduled", uploaded: "Uploaded", held: "Held",
  pinned: "Pinned", dropped: "Not going out (stale / over budget)", issues: "Has style issues" };
function textOf(i) {
  return [i.title, i.hook, i.ref, i.description, i.topic, i.hashtags, i.playlist, i.category, i.thumb_text]
    .join(" ").toLowerCase();
}
function filtered() {
  let items = STATE.items;
  if (SHOW) items = items.filter(i => i.show === SHOW);
  if (KINDF) items = items.filter(i => i.kind === KINDF);
  if (ST && STATUS[ST]) items = items.filter(STATUS[ST]);
  if (FROM) items = items.filter(i => (i.date || "") >= FROM);
  if (TO) items = items.filter(i => (i.date || "") <= TO);
  if (Q.trim()) {
    const ws = Q.toLowerCase().split(/\s+/).filter(Boolean);
    items = items.filter(i => { const t = textOf(i); return ws.every(w => t.includes(w)) || (THQ === Q && THITS[i.ref]); });
  }
  return items;
}
let THT = null;
function searchTranscripts() {
  clearTimeout(THT);
  if (Q.trim().length < 3) { THITS = {}; THQ = ""; return; }
  THT = setTimeout(async () => {
    const q = Q;

function saveHash() {

// ---------- actions ----------

async function act(ref, action, extra = {}) {
  BUSY.add(ref); renderQueue();
  try {
    const r = await api("/api/action", { ref, action, ...extra });
    const i = STATE.items.findIndex(x => x.ref === ref);
    if (i >= 0) STATE.items[i] = { ...STATE.items[i], ...r.row };
    toast(`${{ approve: "Approved", reject: "Rejected", changes: "Changes requested for", reopen: "Reopened", hold: extra.on ? "Held" : "Released", pin: extra.text ? "Pinned" : "Unpinned", edit: "Saved", thumbtext: "New thumbnail words for" }[action]} ${ref.split("/")[1].split("_")[0]}${r.note ? " — " + r.note : ""}`, false, r.undo);
    if (OPEN === ref) fillModalState(STATE.items.find(x => x.ref === ref));
    refresh();
  } catch (e) { toast(e.message, true); }
  finally { BUSY.delete(ref); renderQueue(); }
}
function upsert(row) { const k = STATE.items.findIndex(x => x.ref === row.ref); if (k >= 0) STATE.items[k] = { ...STATE.items[k], ...row }; }

// ---------- #17 select, bulk actions, find and replace ----------

function picked() { return [...PICK].filter(r => STATE.items.some(i => i.ref === r)); }
function renderBulk() {
  const n = picked().length, b = $("#bulk");
  b.hidden = !n;
  if (!n) return;
  b.innerHTML = `<b>${n} selected</b>
    <button class="btn good" data-bulk="approve">✓ Approve</button>
    <button class="btn" data-bulk="hold">Hold</button><button class="btn" data-bulk="release">Release</button>
    <button class="btn" data-bulk="pin" title="Publish at for all of them">📌 Pin…</button>
    <button class="btn warn" data-bulk="changes">✎ Same retake note…</button>
    <button class="btn" data-bulk="reopen">↺ Reopen</button>
    <button class="btn" data-bulk="replace">Find and replace…</button>
    <button class="btn" data-bulk="clear">Clear</button>`;
}
function pick(ref, on, range) {
  if (range && LASTPICK && VISIBLE.includes(LASTPICK) && VISIBLE.includes(ref)) {
    const [a, b] = [VISIBLE.indexOf(LASTPICK), VISIBLE.indexOf(ref)].sort((x, y) => x - y);
    VISIBLE.slice(a, b + 1).forEach(r => on ? PICK.add(r) : PICK.delete(r));
  } else on ? PICK.add(ref) : PICK.delete(ref);
  LASTPICK = ref;
  renderQueue();
}
async function bulk(action) {
  const refs = picked(), n = refs.length;
  if (action === "clear") { PICK.clear(); renderQueue(); return; }
  if (action === "replace") return showReplace();
  const extra = {};
  let api_action = action;
  if (action === "hold" || action === "release") { api_action = "hold"; extra.on = action === "hold"; }
  if (action === "pin") {
    const t = ask(`Publish at for ${n} items: YYYY-MM-DD HH:MM, or a date (each gets that day's first slot, so give times to spread them); empty unpins`, false);
    if (t === null) return; extra.text = t;
  }
  if (action === "changes") { const t = ask(`What should change, for all ${n}? clipper re-cuts each from this note:`, true); if (!t) return; extra.text = t; }
  if (!["changes", "pin"].includes(action) && !confirm(`${action[0].toUpperCase() + action.slice(1)} ${n} item${n > 1 ? "s" : ""}?`)) return;
  refs.forEach(r => BUSY.add(r)); renderQueue();
  try {
    const r = await api("/api/bulk", { action: api_action, refs, ...extra });
    (r.rows || []).forEach(upsert);
    const f = r.failed || [];
    toast(`${action}: ${r.done} done${f.length ? `, ${f.length} failed (${f[0].ref.split("/")[1]}: ${f[0].error})` : ""}`, !!f.length && !r.done, r.undo);
    refresh();
  } catch (e) { toast(e.message, true); }
  finally { refs.forEach(r => BUSY.delete(r)); renderQueue(); }
}
const REP_FIELDS = { title: "Title", description: "Description", hashtags: "Hashtags", tags: "Tags", playlist: "Playlist" };
let REP_LAST = "";  // the inputs the last dry run was for: Apply needs a preview of exactly these
function repBody(dry) {
  return { refs: picked(), find: $("#rFind").value, replace: $("#rRepl").value, dry_run: dry,
    fields: Object.keys(REP_FIELDS).filter(f => $(`#rf_${f}`).checked),
    word: $("#rWord").checked, case: $("#rCase").checked, regex: $("#rRegex").checked };
}
function showReplace() {
  const d = $("#tool"), n = picked().length; d.dataset.kind = "replace";
  d.innerHTML = `<div class="m-head"><b>Find and replace</b><span style="color:var(--faint);font-size:12px">in ${n} selected item${n > 1 ? "s" : ""}, through Kitsu</span><button class="x" data-close>×</button></div>
    <div class="tbody">
      <input class="search" id="rFind" placeholder="Find">
      <input class="search" id="rRepl" placeholder="Replace with (empty deletes it)">
      <div>${Object.entries(REP_FIELDS).map(([f, l]) => `<label><input type="checkbox" id="rf_${f}" ${["title", "description", "hashtags"].includes(f) ? "checked" : ""}>${l}</label>`).join("")}</div>
      <div><label><input type="checkbox" id="rWord" checked>Whole words</label><label><input type="checkbox" id="rCase">Match case</label><label><input type="checkbox" id="rRegex">Regular expression</label></div>
      <div><button class="btn" id="rPrev">Preview (dry run)</button> <button class="btn primary" id="rApply" disabled>Apply</button></div>
      <div class="rep-list" id="rList"><span class="f">Preview first: every line that would change is listed before anything is written.</span></div>
    </div>`;
  const stale = () => { $("#rApply").disabled = JSON.stringify(repBody(true)) !== REP_LAST; };
  d.querySelectorAll("input").forEach(el => el.addEventListener("input", stale));
  $("#rPrev").onclick = async () => {
    const body = repBody(true);
    try {
      const r = await api("/api/replace", body);
      const lines = r.items.reduce((s, it) => s + it.lines.length, 0);
      $("#rList").innerHTML = `<div class="f">${r.items.length} of ${r.checked} items would change, ${lines} lines:</div>` + r.items.map(it => `<div class="it">
        <b>${esc(it.short)}</b>${it.uploaded ? ` <span style="color:var(--amber)">· on YouTube already (Kitsu only; the live video keeps its text)</span>` : ""}
        ${it.lines.map(l => `<div><span class="f">${esc(l.field)}</span> <del>${esc(l.before)}</del><br><span class="f">${" ".repeat(l.field.length)}</span> <ins>${esc(l.after)}</ins></div>`).join("")}</div>`).join("");
      REP_LAST = JSON.stringify(body);
      $("#rApply").disabled = !r.items.length;
      $("#rApply").textContent = `Apply to ${r.items.length} item${r.items.length === 1 ? "" : "s"}`;
    } catch (e) { $("#rList").innerHTML = `<span style="color:var(--red)">${esc(e.message)}</span>`; }
  };
  $("#rApply").onclick = async () => {
    $("#rApply").disabled = true;
    try {
      const r = await api("/api/replace", repBody(false));
      (r.rows || []).forEach(upsert);
      const f = r.failed || [];
      toast(`Replaced in ${r.done} items${f.length ? `; ${f.length} failed (${f[0].ref.split("/")[1]}: ${f[0].error})` : ""}`, !!f.length && !r.done, r.undo);
      d.close(); renderQueue(); refresh();
    } catch (e) { toast(e.message, true); $("#rApply").disabled = false; }
  };
  d.showModal(); $("#rFind").focus();
}

function ask(label, required) { const t = prompt(label); if (t === null) return null; if (required && !t.trim()) { toast("That needs some text.", true); return null; } return t.trim(); }

document.addEventListener("click", e => {
  const lv = e.target.closest("[data-live]");
  if (lv) { liveClick(e, lv); return; }
  if (LIVEMENU !== null) { LIVEMENU = null; renderLive(); }
  const v = e.target.closest("#views button, [data-move]");  // not body[data-view]
  if (v?.dataset.view) { setView(v.dataset.view); return; }
  if (v?.dataset.move) { move(+v.dataset.move); return; }
  const pop = e.target.closest("[data-pop]");
  if (pop) { popOut(pop.dataset.pop); return; }
  const pk = e.target.closest("[data-pick]");
  if (pk) { pick(pk.dataset.pick, pk.checked, e.shiftKey); return; }
  if (e.target.closest(".pickl")) return;
  const bk = e.target.closest("[data-bulk]");
  if (bk) { bulk(bk.dataset.bulk); return; }
  const un = e.target.closest("[data-undo]");
  if (un) { undo(un.dataset.undo); return; }
  if (e.target.closest("[data-close]")) { e.target.closest("dialog").close(); return; }
  if (e.target.id === "undoBtn") { showUndo(); return; }
  if (e.target.id === "pickAll") { VISIBLE.forEach(r => PICK.add(r)); renderQueue(); return; }
  if (e.target.closest("a[href]")) return;  // links inside a clickable row (YouTube) just open
  const t = e.target.closest("[data-tab],[data-act],[data-open]");
  if (!t) return;
  if (t.dataset.tab) { TAB = t.dataset.tab; SEL = null; renderQueue(); return; }
  if (t.dataset.act) {
    const ref = t.dataset.ref, a = t.dataset.act;
    if (a === "changes") { const n = ask("What should change? clipper will re-cut / re-thumbnail it from this note:", true); if (n) act(ref, "changes", { text: n }); }
    else if (a === "reject") { const n = ask("Why reject it? (kept as a scoring example)", true); if (n) act(ref, "reject", { text: n }); }
    else if (a === "approve" && OPEN === ref) keyAct("a", ref);  // in the item window: then the next item
    else act(ref, a);
    return;
  }
  if (t.dataset.open) { if (VISIBLE.includes(t.dataset.open)) SEL = t.dataset.open; openModal(t.dataset.open); }
});
document.addEventListener("change", e => {
  if (e.target.id === "showSel") { SHOW = e.target.value; renderQueue(); }
  if (e.target.id === "kindSel") { KINDF = e.target.value; renderQueue(); }

});
document.addEventListener("input", e => { if (e.target.id === "q") { Q = e.target.value; searchTranscripts(); const pos = e.target.selectionStart; renderQueue(); const q = $("#q"); q.focus(); q.setSelectionRange(pos, pos); } });
$("#syncBtn").onclick = async () => { try { await api("/api/sync", {}); toast("Syncing from Kitsu…"); setTimeout(refresh, 4000); } catch (e) { toast(e.message, true); } };
$("#replanBtn").onclick = async () => { try { await api("/api/replan", {}); toast("Schedule replanned"); refresh(); } catch (e) { toast(e.message, true); } };

let SHOWFREE = (() => { try { return localStorage.getItem("warroom.free") !== "0"; } catch { return true; } })();
let DRAG = null;
function localPin(iso) {  // "2026-10-29T14:00:00-07:00" -> "2026-10-29 14:00" in the schedule's zone
  const d = new Date(iso), tz = STATE.timezone;
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-CA", { timeZone: tz, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" })

}
function ruleWarnings(at, kind, ref) {
  const r = STATE.rules || {}, t = new Date(at), w = [];
  const others = STATE.schedule.filter(e => e.key !== ref);
  const day = localPin(at).slice(0, 10);
  const sameDay = others.filter(e => localPin(e.publish_at).slice(0, 10) === day).length;
  if (r.max_per_day && sameDay >= r.max_per_day) w.push(`${day} already has ${sameDay} (max ${r.max_per_day} a day)`);
  const near = others.find(e => Math.abs(new Date(e.publish_at) - t) < (r.min_gap_minutes || 0) * 60000);

}

  const sel = $("#statsMonth");
  if (!sel.options.length) sel.innerHTML = monthsBack(4).map(m => `<option>${m}</option>`).join("");
  sel.value = a.month;
  $("#statsSub").textContent = a.fetched_at ? "YouTube data as of " + ago(a.fetched_at) : "";
  const delta = (x, y) => y > 0 ? `<span class="d ${x >= y ? "up" : "down"}">${x >= y ? "▲" : "▼"} ${Math.abs(Math.round((x - y) / y * 100))}% vs ${esc(a.prev_month)}</span>` : `<span class="d">${esc(a.prev_month)}: no data</span>`;
  const tile = (label, value, d) => `<div class="tile"><span>${label}</span><b>${value}</b>${d}</div>`;
  const kinds = Object.entries(a.uploads_by_kind).map(([k, v]) => `${v} ${kindName(k)}${v > 1 ? "s" : ""}`).join(" · ");
  const tiles = tile("Views", n(t.views), delta(t.views, p.views))
    + tile("Watch time", (+t.watch_hours).toLocaleString() + " h", delta(t.watch_hours, p.watch_hours))
    + tile("Subscribers", (t.subs >= 0 ? "+" : "") + n(t.subs), delta(t.subs, p.subs))
    + tile("Published", n(a.uploads), `<span class="d">${esc(kinds) || "none"}${a.still_scheduled ? ` · ${a.still_scheduled} more to come` : ""}</span>`);
  const totalT = a.traffic.reduce((s, x) => s + x.views, 0) || 1, maxT = Math.max(1, ...a.traffic.map(x => x.views));
  const traffic = a.traffic.slice(0, 8).map(x => `<span class="lab">${esc(x.label)}</span>
      <span class="track"><div class="fill" style="width:${x.views / maxT * 100}%"></div></span>
      <span class="v">${n(x.views)} · ${Math.round(x.views / totalT * 100)}%</span>`).join("");
  const group = (title, rows) => {
    if (!rows.length) return "";
    const max = Math.max(1, ...rows.map(r => r.median_views));
    return `<div><h3>${title}</h3><div class="hb">${rows.map(r => `<span class="lab ${r.n < 3 ? "few" : ""}" title="${r.n} video${r.n > 1 ? "s" : ""}${r.n < 3 ? ": too few to read much into" : ""}">${esc(["pick", "clip", "short", "segment", "compilation"].includes(r.key) ? kindName(r.key) + "s" : r.key)} <span class="few">(${r.n})</span></span>
      <span class="track"><div class="fill" style="width:${r.median_views / max * 100}%;${r.n < 3 ? "opacity:.45" : ""}"></div></span>
      <span class="v" title="median 7-day views · average % watched · 7-day views in all">${r.median_views} · ${Math.round(r.pct)}% · ${n(r.views)}</span>`).join("")}</div></div>`;
  };
  const vids = rows => rows.map(r => `<div><span class="n">${n(r.d7_views)}</span> <span class="few">${Math.round(r.d7_pct || 0)}% · ${esc(kindName(r.kind))} · ${esc(r.show)}</span> <a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a></div>`).join("");
  $("#stats").innerHTML = `<div class="tiles">${tiles}</div>
    <div class="two">
      <div><h3>Views per day</h3>${dailyChart(a.daily)}</div>
      <div><h3>Where views came from</h3>${traffic ? `<div class="hb">${traffic}</div>` : `<div class="note">No traffic data for this month yet.</div>`}</div>
    </div>
    ${a.with_d7 ? `<div><h3>First 7 days of this month's uploads</h3><div class="note">Each bar is the median 7-day views; then average % watched and the group's 7-day views in all. Faded rows have fewer than 3 videos.</div></div>
    <div class="four">${group("By show", a.by_show)}${group("By kind", a.by_kind)}${group("By weekday published", a.by_weekday)}${group("By hour published", a.by_hour)}</div>
    <div class="two"><div><h3>Best (7-day views)</h3><div class="vids">${vids(a.best)}</div></div>
      <div><h3>Weakest</h3><div class="vids">${vids(a.worst) || `<div class="note">Needs more than 8 videos with 7-day numbers.</div>`}</div></div></div>`
      : `<div class="note">None of this month's uploads is 8 days old yet, so there are no 7-day numbers to compare.</div>`}
    <div class="note">Report as a file: <code>clipper analytics --report${a.month ? " --month " + esc(a.month) : ""}</code> → reports/analytics/${esc(a.month)}.md + .csv</div>
    <div class="tip" id="statTip" hidden></div>`;
}
function dailyChart(days) {
  if (!days.length) return `<div class="note">No daily numbers for this month yet.</div>`;
  const W = 640, H = 170, L = 34, B = 18, T = 6, max = Math.max(1, ...days.map(d => d.views));
  const step = Math.pow(10, Math.floor(Math.log10(max))), top = Math.ceil(max / step) * step;
  const y = v => T + (H - T - B) * (1 - v / top), slot = (W - L) / days.length, bw = Math.max(2, slot - 2);
  const ticks = [0, top / 2, top].map(v => `<line class="gl" x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 5}" y="${y(v) + 3}" text-anchor="end">${v >= 1000 ? (v / 1000) + "k" : v}</text>`).join("");
  const bars = days.map((d, k) => {
    const x = L + k * slot + 1, h = Math.max(1, y(0) - y(d.views)), r = Math.min(4, bw / 2, h);
    const path = `M${x},${y(0)} v${-(h - r)} q0,${-r} ${r},${-r} h${bw - 2 * r} q${r},0 ${r},${r} v${h - r} z`;
    return `<g data-tip="${esc(d.day)}|${d.views}|${d.minutes}|${d.subs}"><rect class="hit" x="${L + k * slot}" y="${T}" width="${slot}" height="${H - T - B}"/><path class="bar" d="${path}"/></g>`;
  }).join("");
  const labels = days.filter((d, k) => k % Math.ceil(days.length / 6) === 0).map(d => {
    const k = days.indexOf(d);
    return `<text x="${L + k * slot + slot / 2}" y="${H - 4}" text-anchor="middle">${d.day.slice(5)}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Views per day">${ticks}${bars}${labels}</svg>`;
}
document.addEventListener("mousemove", e => {
  const tip = $("#statTip");
  if (!tip) return;
  const g = e.target.closest?.("[data-tip]");
  if (!g) { tip.hidden = true; return; }
  const [day, v, m, s] = g.dataset.tip.split("|");
  tip.innerHTML = `${new Date(day + "T12:00:00").toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" })}<br><b>${(+v).toLocaleString()}</b> views<br>${Math.round(m / 60 * 10) / 10} h watched<br>${s >= 0 ? "+" : ""}${s} subscribers`;
  tip.hidden = false;
  tip.style.left = Math.min(innerWidth - 150, e.clientX + 12) + "px"; tip.style.top = (e.clientY + 12) + "px";
});
document.addEventListener("change", e => { if (e.target.id === "statsMonth") { STATS_MONTH = e.target.value; refreshStats(); } });

// ---------- Costs (#50) ----------

async function refreshCosts() {
  const el = $("#costs");
  let c;
  try { c = await api("/api/costs"); } catch (e) { c = { error: e.message }; }
  if (c.error) { el.innerHTML = `<div class="bad">${esc(c.error)}</div>`; return; }
  const usd = v => "$" + (+v || 0).toFixed(2);
  const list = (o, n) => Object.entries(o || {}).slice(0, n).map(([k, v]) => `${esc(k)} ${usd(v)}`).join(", ") || "-";
  const cr = Object.entries(c.credits || {});
  $("#costSub").textContent = c.month;
  el.innerHTML = `
    <div class="row"><span class="big">${usd(c.net_usd)}</span><span>this month${cr.length ? ` after ${cr.map(([k, v]) => `${esc(k)} credit ${usd(v)}`).join(", ")}` : ""}</span></div>
    <div>${list(c.by_kind)}${c.estimated_usd ? ` <span class="f" title="Modal runs are our per-run estimates; earlier model spend was read back from output files">(${usd(c.estimated_usd)} estimated)</span>` : ""}</div>
    <div class="sub">By stage</div><div>${list(c.by_stage, 6)}</div>
    <div class="sub">By show</div><div>${list(c.by_show, 6)}</div>
    <div class="f">${c.calls.toLocaleString()} calls and runs · all time ${usd(c.all_time_usd)} since ${esc(c.since || "-")} · revenue once monetized</div>`;
}

// ---------- Modal (#49) ----------

let CLOUD = null;
async function refreshCloud() {
  try { CLOUD = await api("/api/modal"); } catch (e) { CLOUD = { error: e.message }; }
  renderCloud();
}
function renderCloud() {
  const m = CLOUD, el = $("#cloud");
  if (!m) return;
  if (m.error) { el.innerHTML = `<div class="bad">${esc(m.error)}</div>`; $("#cloudSub").textContent = ""; return; }
  const usd = v => "$" + (+v || 0).toFixed(2), hrs = s => (s / 3600).toFixed(1) + " h", mins = s => Math.round(s / 60) + " min";
  const sp = m.spend || {}, up = (m.containers?.apps || {})[m.app] || [];
  const cap = m.budget || sp.credits || 0, pct = cap ? Math.min(100, 100 * sp.metered / cap) : 0;
  const level = m.budget ? (sp.metered > m.budget ? "over" : pct > 80 ? "warn" : "") : sp.metered > sp.credits ? "over" : "";
  const run = r => `<span class="w" title="${esc(r.what)}">${esc(r.kind === "stream" ? r.what : r.what.replace("/", " · "))}</span>`;
  $("#cloudSub").textContent = m.running.length ? `${m.running.length} running` : up.length ? `${up.length} up` : "idle";
  el.innerHTML = `
    ${sp.error ? `<div class="bad">billing: ${esc(sp.error)}</div>` : `
    <div class="row"><span class="big">${usd(sp.metered)}</span><span>this month${m.budget ? ` of your ${usd(m.budget)} budget` : ` · ${usd(sp.credits)} credit`}</span></div>
    <div class="row"><span class="meter"><i class="${level}" style="width:${pct}%"></i></span><span class="${sp.billed > 0 ? "bad" : ""}">${usd(sp.billed)} billed</span></div>
    <div><span class="${sp.per_hour > 0 ? "now" : ""}">${usd(sp.per_hour)}/h now</span> · ${usd(sp.last_24h)} last 24 h · ${Object.entries(sp.by_app || {}).map(([a, v]) => `${esc(a.replace("clipper-", ""))} ${usd(v)}`).join(", ")}</div>
    <div class="f" title="Each run's call time + 30 s idle at the GPU's price. Modal's billing (above) is the real number.">our per-run estimates: ${usd(m.est_month_usd)} this month, ${usd(m.est_24h_usd)} in 24 h</div>`}
    <div>GPUs: <b style="color:var(--text)">${up.length}</b> / ${m.max_containers} up${up.length ? `, oldest since ${esc(new Date(up[0]).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }))}` : ""}${m.containers?.error ? ` <span class="bad">(${esc(m.containers.error)})</span>` : ""}</div>
    ${m.running.length ? `<div class="sub">Running now</div><div class="runs">${m.running.slice(0, 8).map(r => `${run(r)}<span class="now">${mins(r.elapsed_s)}</span><span>${esc(r.gpu || "default")} · ${hrs(r.audio_s)}</span>`).join("")}</div>` : ""}
    ${m.failures_24h.length ? `<div class="sub">Failed in 24 h</div><div class="runs">${m.failures_24h.slice(0, 5).map(r => `${run(r)}<span class="f">${esc(ago(r.at))}</span><span class="bad" title="${esc(r.error)}">${esc((r.error || "").slice(0, 40))}</span>`).join("")}</div>` : ""}
    ${m.recent.length ? `<div class="sub">Recent runs</div><div class="runs">${m.recent.slice(0, 6).map(r => `${run(r)}<span title="${esc(r.gpu)}, call ${mins(r.call_s || 0)}">${hrs(r.audio_s || 0)}${r.call_s ? " · " + Math.round(r.audio_s / r.call_s) + "×" : ""}</span><span class="${r.ok === false ? "bad" : "f"}">${r.ok === false ? "failed" : "~" + usd(r.est_usd)}</span>`).join("")}</div>` : ""}
    ${m.archives.map(a => `<div class="sub">Archive · ${esc(a.subject)}</div>
      <div class="row"><span class="meter"><i style="width:${a.items ? 100 * a.done / a.items : 0}%"></i></span><span>${a.done.toLocaleString()} / ${a.items.toLocaleString()}</span></div>
      <div>${Math.round(a.hours_done).toLocaleString()} / ${Math.round(a.hours_total).toLocaleString()} h${a.errors ? ` · <span class="bad">${a.errors} errors</span>` : ""}${a.items_per_hour ? ` · ${a.items_per_hour}/h, ETA ${a.eta_h} h` : a.left ? ` · ${a.left} left, not running` : " · done"} · ~${usd(a.est_usd)}</div>`).join("")}
    ${m.links?.[m.app] ? `<div><a href="${esc(m.links[m.app])}" target="_blank" rel="noopener">Open ${esc(m.app)} on modal.com ↗</a></div>` : ""}`;
}

function closeModal() { OPEN = null; const v = $("#modal video"); if (v) v.pause(); $("#modal").close(); }
$("#modal").addEventListener("close", () => { OPEN = null; const v = $("#modal video"); if (v) v.pause(); });

// ---------- phone ----------

function setView(v) {
  document.body.dataset.view = v; store.set("warroom.view", v);
  document.querySelectorAll("#views button").forEach(b => b.classList.toggle("on", b.dataset.view === v));
  const today = v === "schedule" && PHONE.matches && $(".day.today");
  today ? today.scrollIntoView({ block: "start" }) : scrollTo(0, 0);
}
setView(store.get("warroom.view") || "queue");

async function playLow(i, full) {  // phones: a 360p copy made by the server (lowres/ beside the preview)
  const tap = $("#mTap");
  if (!tap || (tap.dataset.wait && !full)) return;
  const play = url => {
    const v = document.createElement("video");
    Object.assign(v, { controls: true, playsInline: true, autoplay: true, src: url, poster: i.thumbnail_url || "" });
    tap.replaceWith(v); v.play().catch(() => { /* needs a tap after waiting: the controls are there */ });
  };
  if (full) return play(i.video_url);
  try {
    const r = await api("/api/lowres?src=" + encodeURIComponent(i.video_url));
    if (OPEN !== i.ref || !$("#mTap")) return;
    if (r.ready) return play(r.url);
    tap.dataset.wait = "1";
    tap.querySelector("span").innerHTML = `<b>⏳</b>Making a phone-size copy${r.ahead ? ` (${r.ahead} ahead of it)` : ""}…
      <span class="alt" data-full style="position:static">Play full quality instead (${r.full_mb} MB)</span>`;
    setTimeout(() => { if (OPEN === i.ref && $("#mTap")) { delete $("#mTap").dataset.wait; playLow(i); } }, 8000);
  } catch (e) { toast(e.message, true); }
}

let TOUCH = null;  // swipe left / right in the item window: next / previous
$("#modal").addEventListener("touchstart", e => {
  const t = e.touches[0], v = e.target.closest("video");
  TOUCH = e.touches.length > 1 || e.target.closest("input, textarea") || (v && t.clientY > v.getBoundingClientRect().bottom - 60)
    ? null : { x: t.clientX, y: t.clientY, at: Date.now() };  // not on the video's scrub bar
}, { passive: true });
$("#modal").addEventListener("touchend", e => {
  if (!TOUCH) return;
  const t = e.changedTouches[0], dx = t.clientX - TOUCH.x, dy = t.clientY - TOUCH.y;
  if (Date.now() - TOUCH.at < 700 && Math.abs(dx) > 70 && Math.abs(dx) > 2 * Math.abs(dy)) move(dx < 0 ? 1 : -1);
  TOUCH = null;
}, { passive: true });

// ---------- keyboard ----------

const KEYS = [
  ["Queue", [["J K", "next / previous item (in the item window too)"], ["Enter", "open the item"], ["Esc", "close the window, or clear the selection"]]],
  ["Decide", [["A", "approve (in the item window: then the next item)"], ["R", "reject, asks why"], ["C", "retake note"],
              ["H", "hold / release"], ["P", "pin a release time"], ["U", "reopen an approved item"]]],
  ["Video (item window)", [["Space", "play / pause"], ["← →", "back / forward 5 s"], ["F", "picture in picture"], ["O", "open the video in its own window"]]],
  ["Other", [["1 2 3 4 5 6", "queue tabs"], ["/", "search"], ["L", "watch the live show"], ["?", "this list"]]],
];
function showKeys() {
  const k = $("#keys");
  k.innerHTML = `<div class="m-head"><b>Keyboard shortcuts</b><button class="x" onclick="this.closest('dialog').close()">×</button></div>
    <div class="k-body">${KEYS.map(([h, rows]) => `<h4>${h}</h4>` + rows.map(([a, b]) =>
      `<span>${a.split(" ").map(x => `<kbd>${esc(x)}</kbd>`).join(" ")}</span><span>${esc(b)}</span>`).join("")).join("")}
    <span></span><span style="color:var(--faint);font-size:12px;margin-top:8px">Off while you type in a box (Esc leaves the box).</span></div>`;
  k.showModal();
}
$("#keysBtn").onclick = showKeys;

function move(d) {
  if (!VISIBLE.length) return;
  const at = VISIBLE.indexOf(OPEN || SEL);
  if (OPEN && at < 0) return;  // opened from the schedule: not in the queue list
  SEL = VISIBLE[at < 0 ? 0 : Math.max(0, Math.min(VISIBLE.length - 1, at + d))];
  renderQueue();
  if (OPEN) { if (SEL !== OPEN) openModal(SEL); return; }
  $(".card.sel")?.scrollIntoView({ block: "nearest", behavior: "smooth" });
}
function keyAct(key, ref) {
  const i = STATE.items.find(x => x.ref === ref);
  if (!i) return;
  if (key === "a") {
    if (i.decision === "approved") return toast("Already approved.");
    const at = VISIBLE.indexOf(ref), next = VISIBLE[at + 1] || VISIBLE[at - 1];
    act(ref, "approve");
    if (OPEN) { if (next && next !== ref) { SEL = next; openModal(next); } else closeModal(); }
  } else if (key === "u") { if (i.decision === "approved") act(ref, "reopen"); else toast("Only approved items reopen."); }
  else if (key === "r") { const n = ask(`Reject ${i.short}? Say why (kept as a scoring example):`, true); if (n) act(ref, "reject", { text: n }); }
  else if (key === "c") {
    if (OPEN) { $("#fChanges").focus(); return; }
    const n = ask("What should change? clipper will re-cut / re-thumbnail it from this note:", true); if (n) act(ref, "changes", { text: n });
  } else if (key === "h") act(ref, "hold", { on: !i.hold });
  else if (key === "p") { if (OPEN !== ref) openModal(ref); $("#fPin").scrollIntoView({ block: "center" }); $("#fPin").focus(); }
}
document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey || !STATE) return;
  const tg = e.target;
  if (tg.matches?.("input, textarea, select, [contenteditable]")) { if (e.key === "Escape" && OPEN) { e.preventDefault(); tg.blur(); } return; }
  if ($("#keys").open) { if (e.key === "?") $("#keys").close(); return; }
  if ($("#tool").open) return;
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key, video = OPEN ? $("#modal video") : null;
  const take = () => e.preventDefault();
  if (k === "?") { take(); showKeys(); }
  else if (k === "j" || k === "k") { take(); move(k === "j" ? 1 : -1); }
  else if (k === "Enter" && !OPEN && SEL && !tg.closest?.("button, a")) { take(); openModal(SEL); }
  else if (k === "Escape" && !OPEN) { if (LIVEMENU !== null) { LIVEMENU = null; renderLive(); } else if (SEL) { SEL = null; renderQueue(); } }
  else if ("arhcpu".includes(k) && k.length === 1 && (OPEN || SEL)) { take(); keyAct(k, OPEN || SEL); }
  else if (k === " " && video && tg !== video) { take(); video.paused ? video.play() : video.pause(); }
  else if ((k === "ArrowLeft" || k === "ArrowRight") && video && tg !== video) { take(); video.currentTime += k === "ArrowRight" ? 5 : -5; }
  else if (k === "f" && video) {
    take();
    if (document.pictureInPictureElement) document.exitPictureInPicture();
    else if (video.requestPictureInPicture) video.requestPictureInPicture().catch(err => toast(err.message, true));
  }
  else if (k === "o" && (OPEN || SEL)) { take(); popOut(OPEN || SEL); }
  else if (/^[1-6]$/.test(k) && !OPEN) { take(); TAB = Object.keys(TABS)[+k - 1]; SEL = null; renderQueue(); }
  else if (k === "/" && !OPEN) { take(); $("#q").focus(); }
  else if (k === "l") {
    const on = LIVE.filter(l => l.live);
    if (!on.length) return toast("Nothing is live right now.");
    take();
    if (on.length === 1) watch(on[0].channel, store.get("warroom.watch") || "here");
    else { LIVEMENU = LIVE.indexOf(on[0]); renderLive(); }
  }
});

loadHash(); refresh(); refreshLive(); refreshCloud(); refreshCosts(); refreshStats();
setInterval(refresh, 15000);
setInterval(refreshLive, 60000);
setInterval(refreshCloud, 60000);
setInterval(refreshCosts, 300000);
setInterval(refreshStats, 900000);
</script>
