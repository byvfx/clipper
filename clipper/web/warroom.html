<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="War Room">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Clipper War Room</title>
<link rel="stylesheet" href="warroom.css">
</head>
<body>
<header>
  <div class="brand">CLIPPER <b>//</b> WAR ROOM</div>
  <div class="clock" id="clock"></div>
  <div class="lives" id="lives"></div>
  <div class="counters" id="counters"></div>
  <div class="tools">
    <button class="btn" id="syncBtn" title="Read decisions and edits from Kitsu now">⟳ Sync Kitsu</button>
    <button class="btn" id="replanBtn" title="Rerun clipper schedule">Replan</button>
    <button class="btn" id="layoutBtn" title="Arrange the panels: drag them, save layouts">Layout</button>
    <button class="btn" id="keysBtn" title="Keyboard shortcuts (?)">?</button>
  </div>
</header>

<main>
  <div class="col" id="vPipe">
    <section class="panel" data-panel="pipeline"><h2>Pipeline <span class="sp" id="pipeSub"></span></h2><div id="streams"></div></section>
    <section class="panel" data-panel="retakes"><h2>Retakes <span class="sp" id="retakeSub"></span></h2><div class="feed" id="retakes"></div></section>
    <section class="panel" data-panel="health"><h2>Health</h2><div class="health" id="health"></div></section>
    <section class="panel" data-panel="modal"><h2>Modal <span class="sp" id="cloudSub"></span></h2><div class="cloud" id="cloud"><div class="empty">Asking Modal…</div></div></section>
    <section class="panel" data-panel="costs"><h2>Costs <span class="sp" id="costSub"></span></h2><div class="cloud" id="costs"><div class="empty">Adding up…</div></div></section>
  </div>

  <section class="panel" id="vQueue" data-panel="queue">
    <h2>Review queue <span class="sp" id="queueSub"></span></h2>
    <div class="queue-bar" id="queueBar"></div>
    <div class="bulk" id="bulk" hidden></div>
    <div class="grid" id="grid"></div>
  </section>

  <section class="panel" id="vStats" data-panel="stats">
    <h2>Analytics <span class="sp" id="statsSub"></span>
      <select id="statsMonth" style="margin-left:auto" title="Month"></select></h2>
    <div class="stats" id="stats"><div class="empty">Reading analytics.json…</div></div>
  </section>

  <section class="panel" id="vSched" data-panel="schedule">
    <h2>Schedule <span class="sp" id="schedSub"></span></h2>
    <div class="uploads" id="uploads"></div>
    <div class="sched-tools" id="schedTools"></div>
    <div class="unslotted" id="unslotted" hidden></div>
    <div class="sched" id="schedule"></div>
  </section>
</main>
<nav class="views" id="views">
  <button data-view="queue"><b>☰</b>Review <span class="n" id="vnQueue"></span></button>
  <button data-view="schedule"><b>◷</b>Schedule</button>
  <button data-view="pipeline"><b>⚙</b>Pipeline</button>
  <button data-view="stats"><b>▥</b>Stats</button>
</nav>

<dialog id="modal"></dialog>
<dialog id="keys"></dialog>
<dialog id="tool"></dialog>
<div id="dock" hidden></div>
<!-- Classic scripts in this order share one global scope; app.js starts the page. -->
<script src="js/core.js"></script>
<script src="js/review.js"></script>
<script src="js/panels.js"></script>
<script src="js/app.js"></script>
</body>
</html>
