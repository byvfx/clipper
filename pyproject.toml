[project]
name = "clipper"
version = "0.1.0"
description = "Stream clipping pipeline: ingest, transcribe, score, render, review, publish"
requires-python = ">=3.12,<3.13"
dependencies = [
    "yt-dlp[default]>=2026.10.10",
    "numpy>=2.0",
    "scipy>=1.13",
    "pyarrow>=17",
    "anthropic>=1.0",
    "gazu>=1.3",
    "google-api-python-client>=2.150",
    "google-auth-oauthlib>=1.2",
    "requests>=2.32",
    "websockets>=13",   # live chat (clipper record)
    "pillow>=11",
]

[project.optional-dependencies]
# GPU worker only (desktop 3060 / laptop A4000). NAS stages install without it.
gpu = [
    "whisperx>=3.8.6",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchvision==0.23.0",
]
# Transcribe on Apple Silicon ([transcribe] backend = "mlx"; the MacBook as a worker).
mac = [
    "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
# Discord review bot (`clipper bot`).
discord = [
    "discord-py>=2.5",
]

[project.scripts]
clipper = "clipper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# PyPI's Windows torch wheels are CPU-only; pull the CUDA 12.8 builds instead.
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
