[project]
name = "clipper"
version = "0.1.0"
description = "Stream clipping pipeline: ingest, transcribe, score, render, review, publish"
requires-python = ">=3.12,<3.13"
dependencies = [
    "yt-dlp[default,deno]>=2026.10.10",  # deno: YouTube needs a JS runtime (clipper preshow)
    "numpy>=2.0",
    "scipy>=1.13",
    "pyarrow>=17",
    "anthropic>=1.0",
    "gazu>=1.3",
    "google-api-python-client>=2.150",
    "google-auth-oauthlib>=1.2",
    "requests>=2.32",
    "websockets>=13",   # live chat (clipper record)
    "pillow>=11",
    "tzdata>=2024.1; sys_platform == 'win32'",  # Windows has no time zone database ([schedule] timezone)
]

[project.optional-dependencies]
# GPU worker only (desktop 3060 / laptop A4000). NAS stages install without it.
gpu = [
    "whisperx>=3.8.6",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchvision==0.23.0",
]
# Transcribe on Apple Silicon ([transcribe] backend = "mlx"; the MacBook as a worker).
mac = [
    "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
# Transcribe on a Modal cloud GPU ([transcribe] backend = "modal", issue #11).
modal = [
    "modal>=1.6",
]
# Who is on screen, by face (`clipper faces`, #54): OpenCV runs two small ONNX models on the CPU.
faces = [
    "opencv-python-headless>=5.0",
]
# Discord review bot (`clipper bot`).
discord = [
    "discord-py>=2.5",
]

[project.scripts]
clipper = "clipper.cli:main"

# Tests and lint (`uv sync` installs this group; CI runs both, .github/workflows/check.yml).
[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff==0.17.3",
]

# The rules are ruff's own defaults for this version, so the pin is the rule set: the
# same on every machine and in CI. Change both pins together, then fix what the new
# version reports.
[tool.ruff]
required-version = "==0.17.3"
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# PyPI's Windows torch wheels are CPU-only; pull the CUDA 12.8 builds instead.
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
